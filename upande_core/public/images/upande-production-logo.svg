<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Upande Production">
  <!--
    Upande Production mark, the sibling of the Upande CRM, Work Management and Irrigation marks. Plays once when it loads
    (the desk replays it when the tile is hovered): a rose grows from the ground: the stem rises, two leaves unfold and the bud opens. Then the Upande arrow rises out of it and grows to full size,
    and the picture falls away. It comes to rest as the plain Upande arrow badge (the same artwork as upande-logo.png), so a
    tile that has finished animating is indistinguishable from the static brand mark.

    Pure CSS, no script: the desk draws this through <img>, where scripts never run anyway. With reduced motion set, only
    the resting mark is shown.
  -->
  <style>
    .arrow  { transform-box: view-box; transform-origin: 50px 50px;
              animation: rise 2.4s cubic-bezier(.3,.7,.2,1) both; }
    .pic    { animation: away 2.4s ease-in both; }
    .stem { stroke-dasharray: 44; stroke-dashoffset: 44; animation: grow 2.4s ease-out both; }
    .lf   { transform-box: fill-box; animation: leaf 2.4s ease-out both; }
    .lf1  { transform-origin: 100% 100%; }
    .lf2  { transform-origin: 0% 100%; }
    .bud  { transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 2.4s cubic-bezier(.3,1.4,.4,1) both; }
    @keyframes grow  { 0% { stroke-dashoffset: 44; } 26%, 100% { stroke-dashoffset: 0; } }
    @keyframes leaf  { 0%, 20% { transform: scale(0); } 38%, 100% { transform: scale(1); } }
    @keyframes bloom { 0%, 30% { transform: scale(0); } 50%, 100% { transform: scale(1); } }
    @keyframes rise {
      0%, 32%   { transform: translate(0, 12px) scale(.3); opacity: 0; }
      38%       { opacity: 1; }
      56%, 64%  { transform: translate(0, -15px) scale(.36); opacity: 1; }
      92%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes away {
      0%, 54%   { opacity: 1; transform: translate(0, 0); }
      74%, 100% { opacity: 0; transform: translate(0, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .pic *, .pic { animation: none; }
      .pic { display: none; }
    }
  </style>

  <circle cx="50" cy="50" r="49.3" fill="#ffffff" stroke="#1c1b19" stroke-width="0.7"/>

  <g class="pic">
    <line x1="22" y1="76" x2="78" y2="76" stroke="#45433f" stroke-width="2.4" stroke-linecap="round"/>
    <line class="stem" x1="50" y1="76" x2="50" y2="36" stroke="#45433f" stroke-width="2.6" stroke-linecap="round"/>
    <path class="lf lf1" d="M50 64 C40 64 32 58 31 50 C41 50 49 55 50 64 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.8" stroke-linejoin="round"/>
    <path class="lf lf2" d="M50 56 C60 56 68 50 69 42 C59 42 51 47 50 56 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.8" stroke-linejoin="round"/>
    <g class="bud"><circle cx="50" cy="31" r="9" fill="#f6f4f1" stroke="#1c1b19" stroke-width="2"/><path d="M45 31 Q50 24 55 31 Q50 36 45 31 Z" fill="none" stroke="#45433f" stroke-width="1.6" stroke-linejoin="round"/></g>
  </g>

  <!-- the Upande arrow, traced from upande-logo.png -->
  <g class="arrow">
    <polygon points="24.4,23.8 64,23.8 64,36.3 24.4,36.3" fill="#635e59"/>
    <polygon points="59.2,23.8 64,23.8 64,36.3 59.2,36.3" fill="#5a5752"/>
    <polygon points="64,23.8 76.5,23.8 76.5,76.2 64,76.2" fill="#45433f"/>
    <polygon points="24.4,64.6 50.5,38.5 64,36.3 64,47.9 35.8,76.2 24.4,76.2" fill="#45433f"/>
    <polygon points="50,39.2 64,36.3 64,47.9 60.4,51.4 60.4,40.6" fill="#1c1b19"/>
  </g>
</svg>
