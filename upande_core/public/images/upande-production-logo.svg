<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Upande Production">
  <!--
    Upande Production mark, the sibling of the Upande CRM, Work Management and Irrigation marks. Plays once when it loads
    (the desk replays it when the tile is hovered): five roses grow from the ground side by side: stems rise, leaves unfold and the blooms open. Then the Upande arrow rises out of it and grows to full size,
    and the picture falls away. It comes to rest as the plain Upande arrow badge (the same artwork as upande-logo.png), so a
    tile that has finished animating is indistinguishable from the static brand mark.

    Pure CSS, no script: the desk draws this through <img>, where scripts never run anyway. With reduced motion set, only
    the resting mark is shown.
  -->
  <style>
    .arrow  { transform-box: view-box; transform-origin: 50px 50px;
              animation: rise 2.4s cubic-bezier(.3,.7,.2,1) both; }
    .pic    { animation: away 2.4s ease-in both; }
    .stem { stroke-dasharray: 50; stroke-dashoffset: 50; animation: grow 2.4s ease-out both; }
    .lf   { transform-box: fill-box; animation: leaf 2.4s ease-out both; }
    .lfl  { transform-origin: 100% 100%; }
    .lfr  { transform-origin: 0% 100%; }
    .bud  { transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 2.4s cubic-bezier(.3,1.4,.4,1) both; }
    .d0 { animation-delay: 0.00s; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.10s; }
    .d3 { animation-delay: 0.15s; }
    .d4 { animation-delay: 0.20s; }
    @keyframes grow  { 0% { stroke-dashoffset: 50; } 28%, 100% { stroke-dashoffset: 0; } }
    @keyframes leaf  { 0%, 22% { transform: scale(0); } 40%, 100% { transform: scale(1); } }
    @keyframes bloom { 0%, 28% { transform: scale(0); } 48%, 100% { transform: scale(1); } }
    @keyframes rise {
      0%, 32%   { transform: translate(0, 12px) scale(.3); opacity: 0; }
      38%       { opacity: 1; }
      56%, 64%  { transform: translate(0, -15px) scale(.36); opacity: 1; }
      92%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes away {
      0%, 54%   { opacity: 1; transform: translate(0, 0); }
      74%, 100% { opacity: 0; transform: translate(0, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .pic *, .pic { animation: none; }
      .pic { display: none; }
    }
  </style>

  <circle cx="50" cy="50" r="49.3" fill="#ffffff" stroke="#1c1b19" stroke-width="0.7"/>

  <g class="pic">
    <line x1="16" y1="76" x2="84" y2="76" stroke="#45433f" stroke-width="2.4" stroke-linecap="round"/>
    <line class="stem d0" x1="26" y1="76" x2="26" y2="59" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/>
    <path class="lf lfl d0" d="M26 64 C20 64 15 60 14 54 C21 54 25 59 26 64 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.5" stroke-linejoin="round"/>
    <g class="bud d0"><circle cx="26" cy="54" r="6.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="1.8"/><path d="M22.5 54 Q26 49 29.5 54 Q26 57.5 22.5 54 Z" fill="none" stroke="#45433f" stroke-width="1.3" stroke-linejoin="round"/></g>
    <line class="stem d1" x1="39" y1="76" x2="39" y2="45" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/>
    <path class="lf lfr d1" d="M39 64 C45 64 50 60 51 54 C44 54 40 59 39 64 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.5" stroke-linejoin="round"/>
    <g class="bud d1"><circle cx="39" cy="40" r="6.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="1.8"/><path d="M35.5 40 Q39 35 42.5 40 Q39 43.5 35.5 40 Z" fill="none" stroke="#45433f" stroke-width="1.3" stroke-linejoin="round"/></g>
    <line class="stem d2" x1="52" y1="76" x2="52" y2="37" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/>
    <path class="lf lfl d2" d="M52 64 C46 64 41 60 40 54 C47 54 51 59 52 64 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.5" stroke-linejoin="round"/>
    <g class="bud d2"><circle cx="52" cy="32" r="6.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="1.8"/><path d="M48.5 32 Q52 27 55.5 32 Q52 35.5 48.5 32 Z" fill="none" stroke="#45433f" stroke-width="1.3" stroke-linejoin="round"/></g>
    <line class="stem d3" x1="65" y1="76" x2="65" y2="47" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/>
    <path class="lf lfr d3" d="M65 64 C71 64 76 60 77 54 C70 54 66 59 65 64 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.5" stroke-linejoin="round"/>
    <g class="bud d3"><circle cx="65" cy="42" r="6.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="1.8"/><path d="M61.5 42 Q65 37 68.5 42 Q65 45.5 61.5 42 Z" fill="none" stroke="#45433f" stroke-width="1.3" stroke-linejoin="round"/></g>
    <line class="stem d4" x1="77" y1="76" x2="77" y2="57" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/>
    <path class="lf lfl d4" d="M77 64 C71 64 66 60 65 54 C72 54 76 59 77 64 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="1.5" stroke-linejoin="round"/>
    <g class="bud d4"><circle cx="77" cy="52" r="6.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="1.8"/><path d="M73.5 52 Q77 47 80.5 52 Q77 55.5 73.5 52 Z" fill="none" stroke="#45433f" stroke-width="1.3" stroke-linejoin="round"/></g>
  </g>

  <!-- the Upande arrow, traced from upande-logo.png -->
  <g class="arrow">
    <polygon points="24.4,23.8 64,23.8 64,36.3 24.4,36.3" fill="#635e59"/>
    <polygon points="59.2,23.8 64,23.8 64,36.3 59.2,36.3" fill="#5a5752"/>
    <polygon points="64,23.8 76.5,23.8 76.5,76.2 64,76.2" fill="#45433f"/>
    <polygon points="24.4,64.6 50.5,38.5 64,36.3 64,47.9 35.8,76.2 24.4,76.2" fill="#45433f"/>
    <polygon points="50,39.2 64,36.3 64,47.9 60.4,51.4 60.4,40.6" fill="#1c1b19"/>
  </g>
</svg>
