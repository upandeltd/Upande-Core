<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Upande Packhouse">
  <!--
    Upande Packhouse mark, the sibling of the Upande CRM, Work Management and Irrigation marks. Plays once when it loads
    (the desk replays it when the tile is hovered): boxes ride in along a conveyor belt, one after another, and a last box is set on top. Then the Upande arrow rises out of it and grows to full size,
    and the picture falls away. It comes to rest as the plain Upande arrow badge (the same artwork as upande-logo.png), so a
    tile that has finished animating is indistinguishable from the static brand mark.

    Pure CSS, no script: the desk draws this through <img>, where scripts never run anyway. With reduced motion set, only
    the resting mark is shown.
  -->
  <style>
    .arrow  { transform-box: view-box; transform-origin: 50px 50px;
              animation: rise 2.4s cubic-bezier(.3,.7,.2,1) both; }
    .pic    { animation: away 2.4s ease-in both; }
    .belt { stroke-dasharray: 5 5; animation: run 2.4s linear both; }
    .bx1  { animation: ride1 2.4s cubic-bezier(.3,.6,.3,1) both; }
    .bx2  { animation: ride2 2.4s cubic-bezier(.3,.6,.3,1) both; }
    .bx3  { animation: ride3 2.4s cubic-bezier(.3,.6,.3,1) both; }
    .bx4  { animation: ride4 2.4s cubic-bezier(.3,.6,.3,1) both; }
    .roll { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 2.4s linear both; }
    @keyframes run   { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -40; } }
    @keyframes spin  { 0% { transform: rotate(0); } 100% { transform: rotate(540deg); } }
    @keyframes ride1 { 0%, 2% { transform: translateX(-64px); opacity: 0; } 8% { opacity: 1; } 34%, 100% { transform: translateX(0); opacity: 1; } }
    @keyframes ride2 { 0%, 10% { transform: translateX(-64px); opacity: 0; } 16% { opacity: 1; } 42%, 100% { transform: translateX(0); opacity: 1; } }
    @keyframes ride3 { 0%, 18% { transform: translateX(-64px); opacity: 0; } 24% { opacity: 1; } 50%, 100% { transform: translateX(0); opacity: 1; } }
    @keyframes ride4 { 0%, 26% { transform: translateY(-20px); opacity: 0; } 32% { opacity: 1; } 50%, 100% { transform: translateY(0); opacity: 1; } }
    @keyframes rise {
      0%, 32%   { transform: translate(0, 12px) scale(.3); opacity: 0; }
      38%       { opacity: 1; }
      56%, 64%  { transform: translate(0, -15px) scale(.36); opacity: 1; }
      92%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes away {
      0%, 54%   { opacity: 1; transform: translate(0, 0); }
      74%, 100% { opacity: 0; transform: translate(0, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .pic *, .pic { animation: none; }
      .pic { display: none; }
    }
  </style>

  <circle cx="50" cy="50" r="49.3" fill="#ffffff" stroke="#1c1b19" stroke-width="0.7"/>

  <g class="pic">
    <line class="belt" x1="17" y1="68" x2="83" y2="68" stroke="#45433f" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="15" y="64" width="70" height="8" rx="4" fill="none" stroke="#45433f" stroke-width="2"/>
    <circle class="roll" cx="22" cy="68" r="2.6" fill="#dcd8d2" stroke="#45433f" stroke-width="1.4"/>
    <circle class="roll" cx="50" cy="68" r="2.6" fill="#dcd8d2" stroke="#45433f" stroke-width="1.4"/>
    <circle class="roll" cx="78" cy="68" r="2.6" fill="#dcd8d2" stroke="#45433f" stroke-width="1.4"/>
    <line x1="25" y1="72" x2="25" y2="78" stroke="#45433f" stroke-width="2" stroke-linecap="round"/>
    <line x1="75" y1="72" x2="75" y2="78" stroke="#45433f" stroke-width="2" stroke-linecap="round"/>
    <g class="bx1"><rect x="21" y="49" width="17" height="15" fill="#dcd8d2" stroke="#45433f" stroke-width="2" stroke-linejoin="round"/><line x1="29.5" y1="49" x2="29.5" y2="56" stroke="#45433f" stroke-width="1.6"/></g>
    <g class="bx2"><rect x="41" y="49" width="17" height="15" fill="#f6f4f1" stroke="#45433f" stroke-width="2" stroke-linejoin="round"/><line x1="49.5" y1="49" x2="49.5" y2="56" stroke="#45433f" stroke-width="1.6"/></g>
    <g class="bx3"><rect x="61" y="49" width="17" height="15" fill="#dcd8d2" stroke="#45433f" stroke-width="2" stroke-linejoin="round"/><line x1="69.5" y1="49" x2="69.5" y2="56" stroke="#45433f" stroke-width="1.6"/></g>
    <g class="bx4"><rect x="43.5" y="36" width="12" height="13" fill="#dcd8d2" stroke="#45433f" stroke-width="2" stroke-linejoin="round"/><line x1="49.5" y1="36" x2="49.5" y2="42" stroke="#45433f" stroke-width="1.6"/></g>
  </g>

  <!-- the Upande arrow, traced from upande-logo.png -->
  <g class="arrow">
    <polygon points="24.4,23.8 64,23.8 64,36.3 24.4,36.3" fill="#635e59"/>
    <polygon points="59.2,23.8 64,23.8 64,36.3 59.2,36.3" fill="#5a5752"/>
    <polygon points="64,23.8 76.5,23.8 76.5,76.2 64,76.2" fill="#45433f"/>
    <polygon points="24.4,64.6 50.5,38.5 64,36.3 64,47.9 35.8,76.2 24.4,76.2" fill="#45433f"/>
    <polygon points="50,39.2 64,36.3 64,47.9 60.4,51.4 60.4,40.6" fill="#1c1b19"/>
  </g>
</svg>
