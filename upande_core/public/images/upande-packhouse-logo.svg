<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Upande Packhouse">
  <!--
    Upande Packhouse mark, the sibling of the Upande CRM, Work Management and Irrigation marks. Plays once when it loads
    (the desk replays it when the tile is hovered): three rose stems drop into a packing crate, one after another. Then the Upande arrow rises out of it and grows to full size,
    and the picture falls away. It comes to rest as the plain Upande arrow badge (the same artwork as upande-logo.png), so a
    tile that has finished animating is indistinguishable from the static brand mark.

    Pure CSS, no script: the desk draws this through <img>, where scripts never run anyway. With reduced motion set, only
    the resting mark is shown.
  -->
  <style>
    .arrow  { transform-box: view-box; transform-origin: 50px 50px;
              animation: rise 2.4s cubic-bezier(.3,.7,.2,1) both; }
    .pic    { animation: away 2.4s ease-in both; }
    .s1 { animation: drop 2.4s cubic-bezier(.4,0,.3,1) both; }
    .s2 { animation: drop2 2.4s cubic-bezier(.4,0,.3,1) both; }
    .s3 { animation: drop3 2.4s cubic-bezier(.4,0,.3,1) both; }
    @keyframes drop  { 0%, 4% { transform: translateY(-26px); opacity: 0; } 12% { opacity: 1; } 30%, 100% { transform: translateY(0); opacity: 1; } }
    @keyframes drop2 { 0%, 14% { transform: translateY(-26px); opacity: 0; } 22% { opacity: 1; } 38%, 100% { transform: translateY(0); opacity: 1; } }
    @keyframes drop3 { 0%, 24% { transform: translateY(-26px); opacity: 0; } 32% { opacity: 1; } 46%, 100% { transform: translateY(0); opacity: 1; } }
    @keyframes rise {
      0%, 32%   { transform: translate(0, 12px) scale(.3); opacity: 0; }
      38%       { opacity: 1; }
      56%, 64%  { transform: translate(0, -15px) scale(.36); opacity: 1; }
      92%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes away {
      0%, 54%   { opacity: 1; transform: translate(0, 0); }
      74%, 100% { opacity: 0; transform: translate(0, 10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .pic *, .pic { animation: none; }
      .pic { display: none; }
    }
  </style>

  <circle cx="50" cy="50" r="49.3" fill="#ffffff" stroke="#1c1b19" stroke-width="0.7"/>

  <g class="pic">
    <g class="s1"><line x1="36" y1="34" x2="36" y2="58" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/><circle cx="36" cy="31" r="5.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="2"/></g>
    <g class="s2"><line x1="50" y1="30" x2="50" y2="58" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/><circle cx="50" cy="27" r="5.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="2"/></g>
    <g class="s3"><line x1="64" y1="34" x2="64" y2="58" stroke="#45433f" stroke-width="2.2" stroke-linecap="round"/><circle cx="64" cy="31" r="5.5" fill="#f6f4f1" stroke="#1c1b19" stroke-width="2"/></g>
    <path d="M22 54 H78 L74 76 H26 Z" fill="#dcd8d2" stroke="#45433f" stroke-width="2" stroke-linejoin="round"/>
    <line x1="30" y1="62" x2="70" y2="62" stroke="#45433f" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- the Upande arrow, traced from upande-logo.png -->
  <g class="arrow">
    <polygon points="24.4,23.8 64,23.8 64,36.3 24.4,36.3" fill="#635e59"/>
    <polygon points="59.2,23.8 64,23.8 64,36.3 59.2,36.3" fill="#5a5752"/>
    <polygon points="64,23.8 76.5,23.8 76.5,76.2 64,76.2" fill="#45433f"/>
    <polygon points="24.4,64.6 50.5,38.5 64,36.3 64,47.9 35.8,76.2 24.4,76.2" fill="#45433f"/>
    <polygon points="50,39.2 64,36.3 64,47.9 60.4,51.4 60.4,40.6" fill="#1c1b19"/>
  </g>
</svg>
